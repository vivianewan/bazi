<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank you · Lucky Charm</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Lucky Charm Bracelet Selector</h1>
  </header>
  <main class="knowledge-page">
    <h2>Payment received</h2>
    <p>Thank you! Stripe has confirmed your checkout session.</p>
    <p class="muted" id="session-line"></p>
    <p><a href="index.html">Back to home</a></p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const sid = params.get('session_id');
    if (sid) {
      document.getElementById('session-line').textContent = 'Session: ' + sid;
      try { localStorage.removeItem('cart'); } catch (e) {}
    }
  </script>
</body>
</html>
